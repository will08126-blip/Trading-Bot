# ─────────────────────────────────────────────────────────────────────────────
# Discord Signals Bot — Configuration
# ─────────────────────────────────────────────────────────────────────────────

# Trading pairs to scan (Binance USDT perpetual futures symbols)
symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - XRPUSDT

# Candle timeframes fetched per scan
timeframes:
  - "1m"
  - "5m"
  - "15m"
  - "4h"

# Number of candles to fetch per timeframe
candle_limits:
  "1m": 100
  "5m": 200
  "15m": 200
  "4h": 150

# ── Signal Scoring Thresholds ─────────────────────────────────────────────────
scoring:
  no_trade_max: 40.0      # below this → no signal posted
  medium_min: 40.0
  strong_min: 60.0
  elite_min: 80.0

# ── Voting Engine Weights ─────────────────────────────────────────────────────
voting:
  strategy_signal_weight: 0.30
  trend_alignment_weight: 0.20
  momentum_weight: 0.15
  volatility_regime_weight: 0.10
  liquidity_weight: 0.15
  session_weight: 0.10

  spread_penalty_weight: 1.0
  slippage_penalty_weight: 1.0

  strategy_weights:
    trend_pullback: 1.0
    breakout_retest: 1.0
    liquidity_sweep_reversal: 0.85
    volatility_expansion: 0.90

# ── Leverage Tiers ────────────────────────────────────────────────────────────
# For each score band, defines the leverage range and portfolio % range.
# Actual values are interpolated linearly within the band.
leverage:
  medium:                  # score 40–59
    score_min: 40
    score_max: 59
    leverage_min: 5
    leverage_max: 10
    portfolio_pct_min: 5
    portfolio_pct_max: 15

  strong:                  # score 60–79
    score_min: 60
    score_max: 79
    leverage_min: 10
    leverage_max: 25
    portfolio_pct_min: 15
    portfolio_pct_max: 40

  elite:                   # score 80+
    score_min: 80
    score_max: 100
    leverage_min: 25
    leverage_max: 100
    portfolio_pct_min: 40
    portfolio_pct_max: 100

  # Common leverage snap values (bot will round to nearest)
  snap_values: [5, 10, 15, 20, 25, 50, 75, 100]

# ── Exit / Take Profit Configuration ─────────────────────────────────────────
exits:
  # TP1: partial exit at this R-multiple (take 50% of position)
  tp1_r_multiple: 1.5
  tp1_exit_pct: 50          # % of position to close at TP1

  # TP2: full exit of remaining position
  tp2_r_multiple: 3.0
  tp2_exit_pct: 100         # % of remaining position to close at TP2

  # After TP1 is hit, move stop loss to breakeven
  move_sl_to_breakeven_after_tp1: true

# ── Session Quality ───────────────────────────────────────────────────────────
# UTC hours for major trading sessions
sessions:
  london_open:   { start: 7,  end: 9,  score: 1.2 }
  ny_open:       { start: 13, end: 15, score: 1.3 }
  overlap:       { start: 13, end: 17, score: 1.4 }
  asia:          { start: 0,  end: 6,  score: 0.85 }
  default:       { start: 0,  end: 23, score: 0.7 }

# ── Regime Rules ─────────────────────────────────────────────────────────────
regime:
  strategy_map:
    trending:             [trend_pullback, breakout_retest]
    ranging:              [liquidity_sweep_reversal, breakout_retest]
    volatility_expansion: [volatility_expansion, breakout_retest]
    compression:          [volatility_expansion]
    unknown:              [trend_pullback, breakout_retest, volatility_expansion]

# ── Cooldown ──────────────────────────────────────────────────────────────────
# Suppress duplicate signals for the same symbol+direction within this window
signal_cooldown_minutes: 30
