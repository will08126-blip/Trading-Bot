# ============================================================
# TRADING BOT - TRADING CONFIGURATION
# Tune these parameters to adjust behavior.
# Secrets go in .env, not here.
# ============================================================

universe:
  symbols:
    - BTC-PERP
    - ETH-PERP
  max_symbols_active: 2
  dynamic_universe_enabled: false

timeframes:
  enabled: ["1m", "5m", "15m", "4h"]
  primary: "5m"
  context: "4h"
  setup: "15m"
  execution: "1m"

risk:
  max_account_drawdown_pct: 15.0     # Kill switch: % drawdown from peak
  max_daily_loss_pct: 10.0            # Daily loss limit
  max_capital_deployed_pct: 50.0      # Max % of bot capital in open positions
  max_simultaneous_positions: 4
  max_positions_per_symbol: 2
  risk_per_trade_pct: 1.0             # Default % of capital risked per trade
  max_risk_per_trade_pct: 2.0         # Absolute upper bound
  min_stop_distance_pct: 0.15
  max_stop_distance_pct: 3.0
  max_slippage_pct: 0.10
  max_notional_per_trade_usd: 50000.0
  reduced_risk_multiplier: 0.5
  leverage_tiers:
    medium_leverage: 2.0
    strong_leverage: 5.0
    elite_leverage: 10.0
    max_leverage_cap: 20.0            # Hard cap; never exceed this

cooldown:
  consecutive_losses_short: 3
  pause_short_hours: 1.0
  consecutive_losses_long: 5
  pause_long_hours: 4.0
  per_strategy_loss_streak: 4
  per_strategy_pause_hours: 2.0
  per_symbol_loss_streak: 4
  per_symbol_pause_hours: 2.0

stop_tp:
  atr_multiplier_stop: 1.5
  structure_weight: 0.5               # 0=pure ATR, 1=pure structure
  tp_mode: r_multiple                 # r_multiple | structure | volatility_adjusted
  r_multiple: 2.0
  tp_atr_multiplier: 3.0
  partial_exits_enabled: false

execution:
  order_type_preference: limit_first  # market | limit | limit_first
  limit_order_timeout_seconds: 30
  max_fill_attempts: 3
  slippage_estimate_basis_points: 5.0
  max_allowed_slippage_pct: 0.10

session:
  london_open_weight: 1.2
  ny_open_weight: 1.3
  asia_weight: 0.85
  overlap_weight: 1.4
  off_hours_weight: 0.7
  hard_block_off_hours: false
  min_session_score: 0.6

voting:
  score_thresholds:
    no_trade_max: 40.0
    medium_min: 40.0
    strong_min: 60.0
    elite_min: 80.0
  strategy_weights:
    trend_pullback: 1.0
    breakout_retest: 1.0
    liquidity_sweep_reversal: 0.85
    volatility_expansion: 0.90
  trend_alignment_weight: 0.20
  momentum_weight: 0.15
  volatility_regime_weight: 0.10
  liquidity_weight: 0.15
  session_weight: 0.10
  strategy_signal_weight: 0.30
  spread_penalty_weight: 0.10
  slippage_penalty_weight: 0.10
  recent_performance_weight: 0.10

strategy_enable:
  trend_pullback: true
  breakout_retest: true
  liquidity_sweep_reversal: true
  volatility_expansion: true

regime_strategy_map:
  trending: ["trend_pullback", "breakout_retest"]
  ranging: ["liquidity_sweep_reversal", "breakout_retest"]
  volatility_expansion: ["volatility_expansion", "breakout_retest"]
  compression: ["volatility_expansion"]
  unknown: ["trend_pullback", "breakout_retest", "volatility_expansion"]

ml:
  regime_model_type: random_forest
  quality_model_type: gradient_boosting
  retrain_schedule: weekly
  min_training_samples: 500
  feature_lookback_candles: 100
  model_confidence_threshold: 0.55
  fallback_to_heuristics: true

llm:
  enabled: true
  daily_report_enabled: true
  weekly_report_enabled: true
  anomaly_summary_enabled: true
  max_tokens_per_report: 1500
  cache_report_hours: 12.0
  graceful_degrade_on_failure: true

backtest:
  default_start_date: "2022-01-01"
  default_end_date: ""
  fee_pct: 0.05
  slippage_pct: 0.05
  assumed_latency_ms: 200

kill_switch_enabled: true
verbose_signal_logging: true
verbose_voting_logging: true
